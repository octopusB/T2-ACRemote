name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build T2.ACRemote.sln -c Release
      - name: Run safety-state tests
        run: dotnet run --project .\tests\T2.ACRemote.Tests\T2.ACRemote.Tests.csproj -c Release --no-build
      - name: Publish single-file x86 programs
        shell: pwsh
        run: |
          dotnet publish .\src\T2.ACRemote.Bridge\T2.ACRemote.Bridge.csproj -p:PublishProfile=SingleFile-x86 -o .\artifacts\bridge
          dotnet publish .\src\T2.ACRemote.Server\T2.ACRemote.Server.csproj -p:PublishProfile=SingleFile-x86 -o .\artifacts\server
          $bridge = @(Get-ChildItem .\artifacts\bridge -File)
          $server = @(Get-ChildItem .\artifacts\server -File)
          Write-Host "Bridge output: $($bridge.Name -join ', ')"
          Write-Host "Server output: $($server.Name -join ', ')"
          if ($bridge.Count -ne 1 -or $bridge[0].Name -ne 'T2.ACRemote.Bridge.exe') { throw "Bridge publish is not a single EXE." }
          if ($server.Count -ne 1 -or $server[0].Name -ne 'T2.ACRemote.Server.exe') { throw "Server publish is not a single EXE." }
      - uses: actions/upload-artifact@v4
        with:
          name: T2-ACRemote-win-x86-single-file
          path: artifacts/**

